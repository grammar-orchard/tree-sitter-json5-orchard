[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-json5-orchard"
description = "JSON5 grammar for tree-sitter (grammar-orchard fork)"
version = "0.1.1"
keywords = ["incremental", "parsing", "tree-sitter", "json5-orchard"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Joaquín León", email = "joaquinandresleon108@gmail.com" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://codeberg.org/grammar-orchard/tree-sitter-json5-orchard"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
