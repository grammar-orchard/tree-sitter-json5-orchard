[package]
name = "tree-sitter-json5-orchard"
description = "JSON5 grammar for tree-sitter (grammar-orchard fork)"
version = "0.1.1"
authors = ["Joaquín León <joaquinandresleon108@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "json5-orchard"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://codeberg.org/grammar-orchard/tree-sitter-json5-orchard"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.12"
